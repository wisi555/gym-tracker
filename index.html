<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6b8cf">
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Log</h1>
    <span class="version" id="version">v…</span>
  </header>

  <main>
    <section id="tab-log" class="tab">
      <div id="log"></div>
      <p class="note" id="storage-status"></p>
    </section>
    <section id="tab-body" class="tab" hidden>
      <p class="placeholder">Morning weight and macros come later.</p>
    </section>
    <section id="tab-progress" class="tab" hidden>
      <p class="placeholder">Progress comes later.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="log" aria-current="page">Log</button>
    <button type="button" data-tab="body">Body</button>
    <button type="button" data-tab="progress">Progress</button>
  </nav>
</body>
</html>
