<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6b8cf">
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved Light/Dark/Auto choice before the page draws (no flash).
    try {
      var t = localStorage.getItem('gym-tracker-theme') || 'light';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Log</h1>
    <span class="version" id="version">v…</span>
    <button type="button" class="header-btn" id="settings-btn" aria-label="Settings and backup">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>

  <main>
    <section id="tab-log" class="tab">
      <div id="install-banner" class="install-banner" hidden></div>
      <div id="log"></div>
    </section>
    <section id="tab-body" class="tab" hidden>
      <div id="body"></div>
    </section>
    <section id="tab-progress" class="tab" hidden>
      <div id="progress"></div>
    </section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <div id="rest-bar" class="rest-bar" role="timer" aria-live="off" hidden></div>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="log" aria-label="Log" aria-current="page"></button>
    <button type="button" data-tab="body" aria-label="Body"></button>
    <button type="button" data-tab="progress" aria-label="Progress"></button>
  </nav>
</body>
</html>
